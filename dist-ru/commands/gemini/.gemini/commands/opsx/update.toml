description = "Обновить изменение — пересмотреть существующие артефакты планирования и сохранить их согласованность (экспериментально)"

prompt = """
Пересмотрите существующие артефакты планирования изменения и сохраните их согласованность. Никогда не редактируйте код.

**Выбор хранилища:** Если пользователь называет хранилище (хранилище — это отдельный репозиторий OpenSpec, зарегистрированный на этой машине) или работа ведётся в одном из них, запустите `openspec store list --json`, чтобы узнать идентификаторы зарегистрированных хранилищ, затем передайте `--store <id>` в командах, которые читают или изменяют спецификации и изменения (`new change`, `status`, `instructions`, `list`, `show`, `validate`, `archive`, `doctor`, `context`, `schemas`, `view`). После выбора считайте флаг `--store <id>` применённым для остальной части процесса. Каждый пример этих команд без флага ниже — краткая форма: перед запуском добавьте флаг. Например, запускайте `openspec status --change "<name>" --json --store "<id>"`, а не форму без флага, показанную ниже. Другие команды этот флаг не принимают. Подсказки, выводимые командами, уже содержат флаг; сохраняйте его в последующих вызовах. Без хранилища команды работают с ближайшим локальным корнем `openspec/`.

**Проверка проекта:** эти шаги рассчитаны на проект, который уже использует OpenSpec. Перед первым шагом, что-либо записывающим (`new change`, `archive`, `sync specs` или создание файла артефакта), убедитесь, что у проекта есть корень: запустите `openspec list --json` (с `--store <id>`, если выбрано хранилище, поскольку тогда корнем служит хранилище) и прочитайте `root`. Объект root означает, что проект настроен. `"root": null` означает, что нет — здесь нет каталога `openspec/`, и запись вроде `openspec new change` создала бы его как побочный эффект. Команда также завершается с ненулевым кодом — это и есть ответ, а не сбой CLI, поэтому читайте JSON вместо повторных попыток или обходных путей.

Один случай `"root": null` не связан с настройкой: когда сообщение об ошибке `status` начинается с `Declared in` или `Invalid store declaration in` и называет `openspec/config.yaml` (или `config.yml`) этого проекта, проект действительно использует OpenSpec через объявленное им хранилище, которое эта машина не может разрешить (хранилище не зарегистрировано или строка `store:` имеет неверный формат). Не считайте его неинициализированным и не пропускайте ветки ниже: остановитесь перед записью и покажите пользователю `message` и `fix` этой ошибки.

В остальных случаях, при отсутствии корня, дальнейшие действия зависят от того, как был достигнут этот процесс:

- **Автовыбор**: вы сами выбрали этот процесс, не называя пользователь OpenSpec, не называя этот навык и не запуская его слэш-команду. Перестаньте использовать OpenSpec и ответьте на запрос обычным образом, как если бы OpenSpec не был установлен. Не просите его ничего настраивать и не упоминайте настройку OpenSpec.
- **Явный запрос об OpenSpec**: пользователь назвал OpenSpec, назвал этот навык или запустил его слэш-команду. Остановитесь перед записью и спросите, как продолжить: настроить этот проект (`openspec init`), использовать хранилище, которое у него уже есть (`--store <id>`), или продолжить без OpenSpec для этого запроса. Дождитесь ответа.

В обеих ветках никогда не создавайте корень как побочный эффект: не запускайте `openspec init`, пока пользователь сам этого не попросит, не создавайте файлы `openspec/` вручную и не позволяйте команде создавать их.

**Input**: при необходимости укажите имя изменения после `/opsx:update` (например, `/opsx:update add-auth`). Если оно не указано, проверьте, можно ли вывести его из контекста беседы. Если имя размыто или двусмысленно, вы ОБЯЗАНЫ запросить список доступных изменений.

Этот процесс пересматривает артефакты, которые уже существуют; `/opsx:continue` создаёт те, которых нет.

**Шаги**

1. **Выберите изменение**

   Если имя указано, используйте его. В противном случае:
   - Выведите из контекста беседы, если пользователь упоминал изменение
   - Выберите автоматически, если существует только одно активное изменение
   - Если однозначно определить не удаётся, запустите `openspec list --json`, чтобы получить доступные изменения, отсортированные по времени последнего изменения, и попросите пользователя выбрать одно

   При запросе предложите последние 3-4 изменённых изменения, показав:
   - Имя изменения
   - Статус (например, «0/5 задач», «завершено», «нет задач»)
   - Как давно оно было изменено (по полю `lastModified`)

   Отметьте самое последнее изменённое изменение как «(Рекомендуется)», так как пользователь, скорее всего, хочет обновить именно его.

   Всегда сообщайте: «Используется изменение: <name>» и способ переопределить выбор (например, `/opsx:update <other>`).

2. **Получите артефакты изменения**
   ```bash
   openspec status --change "<name>" --json
   ```
   Разберите JSON, чтобы понять текущее состояние. Ответ включает:
   - `schemaName`: используемая схема процесса (например, «spec-driven»)
   - `artifacts`: массив артефактов с их статусами («done», «skipped», «ready», «blocked»)
   - `isPlanningComplete`: логическое значение, показывающее, завершены ли все артефакты планирования. В старых версиях CLI то же значение доступно как `isComplete`.
   - `planningHome`, `changeRoot`, `artifactPaths` и `actionContext`: контекст путей и области. Используйте их вместо предположения о путях в репозитории.

   Идентификаторы и пути артефактов берутся из активной схемы — НЕ предполагайте их и НЕ ветвите логику по жёстко заданным именам артефактов. Пользовательские схемы должны работать без изменений.

   Редактируемые файлы — это `artifactPaths.<id>.existingOutputPaths` — конкретные файлы, существующие на диске, уже развёрнутые glob для glob-артефактов (например, `specs/**/*.md`), плюс любой подтверждённый конкретный путь, допустимый под частично заполненным glob-артефактом (шаг 4). НЕ пишите в `resolvedOutputPath`: для glob-артефакта это всё ещё glob-шаблон, а не реальный файл.

3. **Поймите запрос**
   - Если пользователь запросил конкретную правку («дизайн теперь использует X»), это отправная правка.
   - Если пользователь сказал только «обновить» / «сделать согласованным», воспринимайте это как проверку согласованности: прочитайте существующие артефакты и проверьте их между собой на противоречия, пробелы и дублирование.

4. **Прочитайте и согласуйте**
   - Прочитайте артефакты, которые затрагивает запрос, и остальные существующие артефакты изменения.
   - Набросайте запрошенную правку в беседе, а не в файлах. Точно определите, что она меняет; все записи выполняет шаг 5. Затем проверьте каждый другой существующий артефакт относительно наброска правки — в ЛЮБОМ направлении: правка более позднего артефакта может потребовать пересмотра более раннего, а не только наоборот. Порядок сборки — полезный порядок чтения, но не ограничение того, какие артефакты можно пересматривать.
   - Зафиксируйте всё, что теперь не согласовано, отсутствует или противоречит.
   - Предложите правки для файлов, которые уже существуют (`existingOutputPaths`). Если у артефакта нет существующих выходных файлов и статус `ready` или `blocked`, отметьте это и укажите пользователю на `/opsx:continue`, чтобы создать их. Не трогайте артефакты `skipped`; не считайте их отсутствующими и не откладывайте их для процесса continue.
   - Glob-артефакт (например, `specs/**/*.md`) помечается `done`, после того как совпадёт хотя бы один файл, а процесс continue обрабатывает только артефакты `ready`. Если при согласовании обнаружен отсутствующий файл для glob-артефакта с непустым `existingOutputPaths`:
     1. Запустите `openspec instructions "<artifact-id>" --change "<name>" --json` и используйте его `instruction` и `template`. Воспринимайте `context` и `rules` как ограничения; не копируйте их в файл. Если инструкции сообщают `skipped: true`, не создавайте файл. Прочитайте актуальные зависимые файлы с диска; если обязательная не пропущенная зависимость отсутствует, остановитесь и сначала попросите пользователя её восстановить.
     2. Выберите конкретный путь внутри `changeRoot`, который соответствует `artifactPaths.<id>.outputPath` и ещё не существует. Проверьте, что он остаётся внутри `changeRoot` после разрешения симлинкованных родительских каталогов. Glob-`resolvedOutputPath` не является допустимой целью.
     3. Включите новый файл в предложенные на шаге 5 правки и создайте его только после подтверждения пользователем.
     4. После подтверждения, непосредственно перед созданием, обновите статус и инструкции. Проверьте, что артефакт всё ещё в области видимости, не пропущен и частично заполнен; повторите проверки конкретных путей выше.
     5. Используйте операцию создания, которая завершается ошибкой, если цель уже существует. Если `instruction` делегирует создание другому навыку или команде, вызовите его, только если он может соблюсти подтверждённый путь и эти ограничения; в противном случае остановитесь. Если любая проверка не пройдена или подтверждённый набросок больше не валиден, остановитесь и согласуйте с пользователем, вместо того чтобы заменять существующее содержимое или выбирать другой путь.
   - Если изменение уже согласовано, сообщите об этом и не предлагайте правок.

5. **Подтвердите и примените по одному артефакту за раз**
   - Этот шаг выполняет каждую запись артефакта в этом процессе; ни один предыдущий шаг не редактирует артефакты.
   - Покажите каждую предложенную правку и причину — включая запрошенную правку, набросанную на шаге 4. Пишите только после подтверждения пользователем.
   - Если пользователь отклоняет правку, не записывайте её — оставьте артефакт без изменений.
   - Когда требуется существенная переработка, сначала получите правила и шаблон этого артефакта:
     ```bash
     openspec instructions "<artifact-id>" --change "<name>" --json
     ```

6. **Укажите следующий шаг (только рекомендация — НИКОГДА не выполняйте его)**
   - Артефакты с пустым `existingOutputPaths` и статусом `ready` или `blocked` -> предложите `/opsx:continue` для их создания.
   - Изменение уже реализовано (задачи отмечены / уже применено) -> код может больше не соответствовать изменённому плану; предложите `/opsx:apply` для переноса дельты в код.
   - Всё готово и реализовано -> предложите `/opsx:archive`.

**Результат**

После каждого вызова покажите:
- Какие артефакты пересмотрены (и какие предложенные правки отклонены)
- Любой файл, созданный под glob-артефактом, который уже был частично заполнен
- Всё, что отложено для `/opsx:continue` (артефакты без файлов и со статусом `ready` или `blocked`, никогда артефакты `skipped`)
- Текущее состояние изменения и рекомендуемую следующую команду

**Ограничения**
- Только артефакты планирования — НИКОГДА не редактируйте код реализации. Если изменённый план подразумевает изменения в коде, остановитесь и укажите на `/opsx:apply`.
- Используйте идентификаторы и пути артефактов, сообщаемые `openspec status`; никогда не ветвите логику по жёстко заданным именам артефактов.
- Редактируйте только конкретные файлы из `existingOutputPaths` плюс любой подтверждённый конкретный путь, допустимый под частично заполненным glob-артефактом (шаг 4); никогда не пишите в glob-`resolvedOutputPath`.
- Не продвигайте границу сборки: если у артефакта пустой `existingOutputPaths` и статус `ready` или `blocked`, это задача `/opsx:continue`. Не трогайте артефакты `skipped`. Единственная область для новых файлов — подтверждённый конкретный путь под glob-артефактом с непустым `existingOutputPaths`.
- Подтверждайте каждую правку с пользователем перед записью.
- Если запрос меняет *намерение* изменения, а не уточняет его, рекомендуйте начать заново с `/opsx:new` (эвристика «Обновить или начать заново»).
"""
