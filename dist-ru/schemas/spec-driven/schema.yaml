name: spec-driven
version: 1
description: Процесс OpenSpec по умолчанию — предложение → спецификации → дизайн → задачи
artifacts:
  - id: proposal
    generates: proposal.md
    description: Исходный документ предложения, описывающий изменение
    template: proposal.md
    instruction: |
      Создайте документ предложения, который обосновывает, ЗАЧЕМ нужно это изменение.

      Разделы:
      - **Зачем**: 1-2 предложения о проблеме или возможности. Какую проблему это решает? Почему сейчас?
      - **Что меняется**: маркированный список изменений. Будьте конкретны относительно новых возможностей, доработок или удалений. Помечайте обратно несовместимые изменения меткой **BREAKING**.
      - **Возможности**: определите, какие спецификации будут созданы или изменены:
        - **Новые возможности**: перечислите вводимые возможности. Каждая становится новым файлом `specs/<capability-path>/spec.md`. Называйте каждую возможность по устойчивому поведению системы (например, `user-auth`), а не по работе в этом изменении (например, `add-login-endpoint`). Выбирайте связную границу, способную владеть связанными требованиями по мере развития системы; избегайте широких возможностей-«сборников». Используйте kebab-case для сегментов пути, которые вы вводите (например, `user-auth` или `identity/user-auth`), и следуйте существующей организации спецификаций проекта.
        - **Изменённые возможности**: перечислите существующие возможности, чьи ТРЕБОВАНИЯ меняются. Включайте только если меняется поведение на уровне спецификации (а не только детали реализации). Каждая требует файл дельта-спецификации. Используйте точный существующий путь внутри `openspec/specs/`. Оставьте пустым, если изменений требований нет.
      - **Влияние**: затронутый код, API, зависимости или системы.

      ВАЖНО: раздел «Возможности» критичен. Он создаёт контракт между
      фазами предложения и спецификаций. Перед заполнением изучите существующие
      спецификации: выполните `openspec list --specs` для получения перечня
      возможностей проекта, затем `openspec show "<spec-id>" --type spec --json --no-scenarios`
      для любых похожих — это возвращает назначение возможности и тексты требований,
      не подтягивая в контекст целые файлы спецификаций. Добавляйте `--store "<id>"`
      к обеим командам только для зарегистрированного автономного хранилища и
      сохраняйте `--type spec`: иначе изменение и спецификация с одним именем
      дадут ошибку неоднозначного элемента. `openspec list` без `--specs` выводит
      незавершённые изменения, а не спецификации — он никогда не показывает, что
      проект уже покрывает. Повторно используйте точный путь существующей возможности
      вместо введения почти дублирующего имени.
      Фильтрованное чтение — это лишь обзор. Прежде чем решать, что уже покрыто
      или что должно измениться, прочитайте каждую relevantную спецификацию полностью,
      включая сценарии, командой `openspec show "<spec-id>" --type spec` (с тем же
      правилом `--store`). Каждая возможность, перечисленная здесь, потребует
      соответствующего файла спецификации.

      Каждое изменение должно либо объявить хотя бы одну возможность (новую или
      изменённую), либо явно отказаться от спецификаций: `openspec validate`
      отклоняет изменение с нулевым числом дельт, если в `.openspec.yaml` изменения
      не задано `skip_specs: true`. Используйте `skip_specs: true` только когда
      поведение на уровне спецификации не меняется (чистый рефакторинг, инструменты,
      документация) — спецификации описывают поведение, поэтому если поведение
      не меняется, не должна меняться и спецификация. Не выдумывайте требование
      только ради прохождения валидации.

      Держите документ кратким (1-2 страницы). Сосредоточьтесь на «зачем», а не
      на «как» — детали реализации принадлежат design.md.

      Это основа — спецификации, дизайн и задачи строятся на нём.
    requires: []

  - id: specs
    generates: "specs/**/*.md"
    description: Подробные спецификации изменения
    template: spec.md
    instruction: |
      Создайте файлы спецификаций, которые определяют, ЧТО система должна делать.

      Спецификация — это контракт поведения, а не план реализации.

      Хорошее содержимое спецификации:
      - Наблюдаемое поведение, на которое полагаются пользователи или下游ные системы
      - Входные данные, выходные данные и условия ошибок
      - Внешние ограничения (безопасность, приватность, надёжность, совместимость)
      - Сценарии, которые можно проверить тестами или явно валидировать

      Чего избегать в спецификациях:
      - Внутренние имена классов и функций
      - Выбор библиотек или фреймворков
      - Пошаговые детали реализации
      - Подробные планы выполнения (они принадлежат design.md или tasks.md)

      Быстрая проверка: если реализацию можно изменить без изменения внешне
      наблюдаемого поведения, это, скорее всего, не должно входить в спецификацию.

      Создайте один файл спецификации на каждую возможность, перечисленную в разделе
      «Возможности» предложения. `<capability-path>` — это каталог спецификации
      относительно `specs/` (например, `user-auth` или `identity/user-auth`).
      Сохраняйте полный путь:
      - Новые возможности: используйте точный путь из предложения — `specs/<capability-path>/spec.md`. Любой сегмент пути, впервые введённый в предложении, должен быть в kebab-case. Следуйте существующей организации проекта; не добавляйте новый уровень домена, если проект использует плоскую раскладку.
      - Изменённые возможности: используйте точный существующий путь из `openspec/specs/<capability-path>/` при создании дельты по адресу `specs/<capability-path>/spec.md`. Выполните `openspec list --specs`, чтобы подтвердить этот путь перед записью дельты, добавляя `--store "<id>"` только для зарегистрированного автономного хранилища — опечатанный или выдуманный путь указывает на несуществующую возможность, а не на ту, что вы имели в виду. Не перемещайте и не переименовывайте возможность.

      Пишите файлы спецификаций по одному, чтобы пользователь видел прогресс, а
      прерванный запуск сохранил уже записанные файлы:
      - Прежде чем что-либо писать, сравните возможности, перечисленные в предложении,
        с уже существующими файлами `specs/<capability-path>/spec.md`
        и начните с первой возможности, у которой нет файла. Не переписывайте
        существующий файл, если пользователь не просил об этом.
      - Перед каждым файлом одной строкой сообщайте, для какой возможности вы пишете.
      - Записывайте каждый файл, как только набросали его. Не планируйте все файлы
        до записи первого.
      - Остановитесь, когда у каждой возможности из предложения будет свой файл.

      Должен существовать хотя бы один файл спецификации, если в `.openspec.yaml`
      изменения не задано `skip_specs: true` (нет изменений поведения на уровне
      спецификации) — `openspec validate` отклоняет изменение с нулевым числом
      дельт без этого маркера. Если предложение не перечисляет возможностей и
      `skip_specs` не задан, сначала вернитесь к предложению.

      Операции дельты (используйте заголовки ##):
      - **Добавленные требования (ADDED)**: новые возможности
      - **Изменённые требования (MODIFIED)**: изменённое поведение — должно включать полный обновлённый контент
      - **Удалённые требования (REMOVED)**: устаревшие функции — должно включать **Reason** и **Migration**
      - **Переименованные требования (RENAMED)**: только переименования — формат FROM:/TO:

      Требования к формату:
      - Каждое требование: `### Requirement: <name>`, затем описание
      - Используйте SHALL/MUST для нормативных требований (избегайте should/may)
      - Каждый сценарий: `#### Scenario: <name>` в формате WHEN/THEN
      - **КРИТИЧНО**: сценарии должны использовать ровно 4 решётки (`####`). Использование 3 решёток или маркеров списка приведёт к молчаливому сбою.
      - Каждое требование должно иметь хотя бы один сценарий.
      - Держите описание каждого требования (текст между `### Requirement:` и его первым сценарием) в пределах 500 символов. `openspec validate` помечает более длинные описания в требованиях ADDED и в основной спецификации. Это предупреждение: обычная валидация по-прежнему проходит, но `openspec validate --strict` на этом падает. При написании нового требования формулируйте одно поведение на требование: переносите примеры и краевые случаи в сценарии, а требование, покрывающее несколько поведений, разделяйте на отдельные блоки `### Requirement:`, каждый со своими сценариями. В MODIFIED сохраняйте существующий блок требования целиком; никогда не разделяйте, не сокращайте и не переписывайте существующий текст только ради длины. Разделяйте существующее длинное требование только когда пользователь просит об этом в изменении с этой целью: в MODIFIED сохраните его заголовок и все сценарии, сократите описание до одного поведения без изменения смысла, затем добавьте каждое удалённое поведение как отдельное требование ADDED со своими сценариями.

      Только для новых возможностей: первый раздел дельта-спецификации — `## Purpose` —
      одно или два предложения (50+ символов, иначе `openspec validate --strict`
      сообщит, что он слишком краткий), описывающих, для чего предназначена
      возможность. Архивирование копирует его в создаваемую основную спецификацию;
      без него новая основная спецификация остаётся с заполнителем
      `TBD ... Update Purpose after archive`, который нужно заполнить вручную. НЕ
      добавляйте `## Purpose` в дельту для существующей возможности — у той
      спецификации он уже есть, а из дельты он игнорируется. Чтобы изменить Purpose
      существующей возможности — включая оставшийся заполнитель `TBD` — отредактируйте
      `<planningHome.root>/openspec/specs/<capability-path>/spec.md` напрямую.
      `planningHome.root` берётся из ответа `openspec instructions ... --json`.
      Всегда используйте его, а не путь относительно репозитория: он разрешается
      в хранилище, когда изменение живёт в нём — будь то от `--store`, указатель
      `store:` проекта или глобальное хранилище по умолчанию — иначе в текущий
      репозиторий. Не пытайтесь определить, какой случай применим; поле уже это
      знает.

      Процесс для требований MODIFIED:
      1. Найдите существующее требование в `<planningHome.root>/openspec/specs/<capability-path>/spec.md` (тот же учитывающий хранилище корень, что выше)
      2. Скопируйте ВЕСЬ блок требования (от `### Requirement:` через все сценарии)
      3. Вставьте под `## MODIFIED Requirements` и отредактируйте под новое поведение
      4. Убедитесь, что текст заголовка совпадает точно (без учёта пробелов)

      Частая ловушка: MODIFIED с частичным контентом теряет детали при архивировании.
      Если добавляете новые аспекты без изменения существующего поведения, используйте ADDED.

      Пример (новая возможность, поэтому первый раздел — `## Purpose`):
      ```
      # Spec Delta

      ## Purpose

      Позволяет пользователям выгружать свои данные из продукта в переносимом формате.

      ## ADDED Requirements

      ### Requirement: Пользователь может экспортировать данные
      Система SHALL позволять пользователям экспортировать свои данные в формате CSV.

      #### Scenario: Успешный экспорт
      - **WHEN** пользователь нажимает кнопку «Export»
      - **THEN** система скачивает CSV-файл со всеми данными пользователя

      ## REMOVED Requirements

      ### Requirement: Старый экспорт
      **Reason**: заменён новой системой экспорта
      **Migration**: используйте новый endpoint экспорта по адресу /api/v2/export
      ```

      Спецификации должны быть проверяемыми — каждый сценарий — потенциальный тестовый случай.
    requires:
      - proposal

  - id: design
    generates: design.md
    description: Технический документ дизайна с деталями реализации
    template: design.md
    instruction: |
      Создайте документ дизайна, который объясняет, КАК реализовать изменение.

      Когда включать design.md (создавайте, только если что-то применимо):
      - Сквозное изменение (несколько сервисов/модулей) или новый архитектурный паттерн
      - Новая внешняя зависимость или значительные изменения модели данных
      - Сложность безопасности, производительности или миграции
      - Неоднозначность, от которой выигрывают технические решения перед кодированием

      Разделы:
      - **Контекст**: только текущее состояние и ограничения, нужные для объяснения подхода. Ссылайтесь на предложение за мотивацией вместо её повторения (например, «См. proposal.md — Why»).
      - **Цели / нецели**: чего этот дизайн достигает и что явно исключает. Не повторяйте область предложения — добавляйте только границы уровня дизайна.
      - **Решения**: ключевые технические выборы с обоснованием (почему X, а не Y?). Для каждого решения приводите рассмотренные альтернативы.
      - **Риски / компромиссы**: известные ограничения, то, что может пойти не так. Формат: [Риск] → Митигация
      - **План миграции**: шаги развёртывания, стратегия отката (если применимо)
      - **Открытые вопросы**: неизвестные, которые можно безопасно отложить без
        изменения спецификаций, подхода или разбивки на задачи. Пропустите, если их нет.

      Открытые вопросы — для genuinely откладываемых неизвестных, а не решений, которые
      вы пропустили. Если вопрос изменил бы спецификации, выбранный подход или разбивку
      на задачи, решите его сейчас — спросите пользователя вместо предположений.

      Сосредоточьтесь на архитектуре и подходе, а не на построчной реализации.
      Предложение покрывает зачем и что; дизайн покрывает как. Ссылайтесь на
      предложение за мотивацией и, после написания, на спецификации за требованиями —
      если раздел только повторял бы их, укажите на них вместо повторения.

      Хорошие документы дизайна объясняют «почему» за техническими решениями.
    requires:
      - proposal

  - id: tasks
    generates: tasks.md
    description: Чек-лист реализации с отслеживаемыми задачами
    template: tasks.md
    instruction: |
      Создайте список задач, разбивающий работу по реализации.

      Перед написанием задач проверьте design.md на открытые вопросы. Если какой-то
      из них изменил бы то, что будет построено, сначала решите его с пользователем —
      не закрепляйте неоговорённое предположение в списке задач.

      **ВАЖНО: следуйте шаблону ниже для отслеживаемых задач.** Фаза apply разбирает
      формат чекбоксов для отслеживания прогресса. Клетка, содержащая только `x`,
      считается выполненной — в любом регистре и с любым пробелом, так что `- [ x]`
      тоже выполнена. Любой другой маркер, включая `- [~]`, `- [-]` и пустой `- []`,
      читается как невыполненный. Строка без чекбокса вообще не отслеживается.

      Рекомендации:
      - Группируйте связанные отслеживаемые задачи под нумерованными заголовками ##
      - Каждая отслеживаемая задача должна быть чекбоксом: `- [ ] X.Y Описание задачи`
      - Задачи должны быть достаточно малы, чтобы выполнить их за одну сессию
      - Упорядочивайте задачи по зависимостям (что должно быть сделано первым?)
      - Отслеживайте работу по реализации и проверке, которую можно завершить до
        архивирования. Если запрошенный процесс включает архивирование или работу,
        требующую архивации этого изменения, сохраните эти шаги обычными маркерами
        в необязательном разделе `## Последующие шаги процесса` в конце tasks.md. Эти
        маркеры — справочная информация вне отслеживаемого прогресса задач.
      - Каждая задача должна указывать, как проверить завершение (тест, команда,
        наблюдаемое поведение или готовый артефакт). Помещайте проверку в
        описание чекбокса этой задачи. Используйте отдельную задачу проверки только
        когда она проверяет более широкую интеграцию или поведение системы,
        охватывающее несколько задач реализации.
      - Каждая группа задач должна включать тесты и документацию, которые требует
        её собственная работа. НЕ собирайте тестирование или документацию в
        финальную группу — когда поздняя группа впервые затрагивает работу ранней,
        сбои каскадом возвращаются через все промежуточные группы и вынуждают
        переделки. Группа, чья работа не требует ни того ни другого, например
        scaffolding или установка зависимостей, не несёт ни того ни другого.
        Финальная группа предназначена только для интеграционных проверок, а не
        для тестов и документации, которую была должна более ранняя группа.

      Пример:
      ```
      # Tasks

      ## 1. Setup

      - [ ] 1.1 Создать новую структуру модуля и проверить наличие ожидаемых файлов
      - [ ] 1.2 Добавить зависимости в package.json и проверить успешность установки пакетов

      ## 2. Core Implementation

      - [ ] 2.1 Реализовать функцию экспорта данных и проверить прохождение теста экспорта
      - [ ] 2.2 Добавить утилиты форматирования CSV и проверить, что модульные тесты покрывают кавычки и разделители
      - [ ] 2.3 Документировать API экспорта в docs/export.md и проверить, что задокументированная команда выполняется как написано
      ```

      Где применимо, добавляйте последующие шаги процесса обычными маркерами, например:
      ```
      ## Последующие шаги процесса

